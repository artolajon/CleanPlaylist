<div class="slidecontainer" class="card">
  <label>Number of songs for each artist</label>
  <input type="range" min="1" max="10" class="slider" id="myRange" [(ngModel)]="songNumberLimit" (change)="editLimit()">
  {{songNumberLimit}}
  <div class="button-row">
    <button (click)="createPlaylist()" class="principal" [disabled]="artistSongs.length<inputElements.length">
        <span *ngIf="artistSongs.length<inputElements.length">Searching for songs...({{artistSongs.length}}/{{inputElements.length}})</span>
        <span  *ngIf="artistSongs.length>=inputElements.length">Confirm</span>
      </button>
    </div>
</div>
<div>

  <app-errors [errors]="errors" (retry)="retry()">
  </app-errors>

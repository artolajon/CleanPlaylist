<form [formGroup]="artistsForm" (submit)="searchArtists()">
  <div class="card">
    <label>Artist name</label>
    <input formControlName="name" placeholder="Paste (or write) artist name here"/>
    <div class="button-row">
      <button [disabled]="!artistsForm.valid" class="principal">Search for artists</button>
    </div>
  </div>


</form>
